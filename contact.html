<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | APRIL GRID</title>
    <meta name="description" content="Get in touch with April Grid to start your next project.">
    <link rel="icon" type="image/png" href="/assets/logo-main.png">
</head>
<body>
    <div id="navbar-container"></div>

    <section class="section" style="padding-top: 160px;">
        <div class="container split-layout">
            
            <!-- Left Side: Contact Form -->
            <div class="fade-up">
                <h1 style="font-size: clamp(3rem, 8vw, 5rem); margin-bottom: 24px; text-transform: uppercase;">Let's Talk.</h1>
                <p style="font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 40px;">
                    Fill out the form below and our team will get back to you within 24 hours.
                </p>
                
                <form class="contact-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label for="company">Company</label>
                            <input type="text" id="company" name="company" placeholder="Your Company">
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="service">Service Needed</label>
                        <select id="service" name="service" required style="color: var(--text-secondary);">
                            <option value="" disabled selected>Select a Service</option>
                            <option value="digital-marketing">Digital Marketing</option>
                            <option value="web-dev">Web Design & Dev</option>
                            <option value="app-dev">Mobile App Dev</option>
                            <option value="ad-production">Advertisement Production</option>
                            <option value="sap">SAP Software</option>
                            <option value="custom-software">Custom Business Software</option>
                            <option value="ai">Digital Creation with AI</option>
                            <option value="branding">Branding & Print</option>
                            <option value="motion">Motion Graphics</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="budget">Budget Range</label>
                        <select id="budget" name="budget" style="color: var(--text-secondary);">
                            <option value="" disabled selected>Select Budget</option>
                            <option value="small">&lt; $10k</option>
                            <option value="medium">$10k - $50k</option>
                            <option value="large">$50k - $100k</option>
                            <option value="enterprise">&gt; $100k</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required placeholder="Tell us about your project..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary" style="margin-top: 24px; align-self: flex-start; cursor: pointer;">Send Message</button>
                </form>
            </div>
            
            <!-- Right Side: Office Details -->
            <div class="fade-up delay-1" style="background: var(--bg-card); padding: 60px 40px; border: 1px solid var(--border-color); border-radius: 4px; height: 100%; display: flex; flex-direction: column; justify-content: center;">
                <h3 style="font-size: 2rem; margin-bottom: 40px;">Office</h3>
                
                <div style="margin-bottom: 40px;">
                    <h4 style="color: var(--text-secondary); text-transform: uppercase; font-size: 0.9rem; margin-bottom: 8px;">Address</h4>
                    <p style="font-size: 1.2rem;">Trivandrum,<br>Kerala, India</p>
                </div>
                
                <div style="margin-bottom: 40px;">
                    <h4 style="color: var(--text-secondary); text-transform: uppercase; font-size: 0.9rem; margin-bottom: 8px;">Direct Contact</h4>
                    <p style="font-size: 1.2rem; margin-bottom: 8px;"><a href="mailto:hello@aprilgrid.com" class="text-accent">hello@aprilgrid.com</a></p>
                    <p style="font-size: 1.2rem;">+91 9688 503503</p>
                </div>
                
                <div>
                    <h4 style="color: var(--text-secondary); text-transform: uppercase; font-size: 0.9rem; margin-bottom: 8px;">Follow Us</h4>
                    <div style="display: flex; gap: 20px;">
                        <a href="https://www.instagram.com/aprilgrid" target="_blank" style="font-size: 1.1rem; text-decoration: underline;">Instagram</a>
                        <a href="#" style="font-size: 1.1rem; text-decoration: underline;">LinkedIn</a>
                        <a href="#" style="font-size: 1.1rem; text-decoration: underline;">Behance</a>
                    </div>
                </div>
            </div>
            
        </div>
    </section>

    <div id="footer-container"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selects = document.querySelectorAll('select');
            selects.forEach(select => {
                select.addEventListener('change', function() {
                    this.style.color = 'var(--text-primary)';
                });
            });
        });
    </script>
</body>
</html>
