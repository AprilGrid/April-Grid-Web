<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | APRIL GRID</title>
    <meta name="description" content="Get in touch with April Grid to start your next project.">
    <link rel="icon" type="image/png" href="/assets/logo-main.png">
</head>
<body>

    <!-- Sleek Futuristic Preloader -->
    <div id="preloader">
        <div class="preloader-content">
            <div class="preloader-count">00</div>
            <div class="preloader-tagline">APRIL GRID • CONNECT CHANNELS</div>
        </div>
    </div>

    <!-- Glowing Cyber Grid Backgrounds -->
    <div class="bg-grid-overlay"></div>
    <div class="bg-radial-glow"></div>

    <div id="navbar-container"></div>

    <section class="section" style="padding-top: 180px;">
        <div class="container split-layout">
            
            <!-- Left Side: Futuristic Contact Form -->
            <div class="fade-up">
                <h1 style="font-size: clamp(3rem, 8vw, 5.5rem); margin-bottom: 24px; text-transform: uppercase;">Let's Talk.</h1>
                <p style="font-size: 1.15rem; color: var(--text-secondary); margin-bottom: 48px;">
                    Fill out the form below and our team will get back to you within 24 hours.
                </p>
                
                <form class="contact-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                        <div class="form-group">
                            <input type="text" id="name" name="name" required placeholder="John Doe">
                            <label for="name">Name</label>
                        </div>
                        <div class="form-group">
                            <input type="text" id="company" name="company" placeholder="Your Company">
                            <label for="company">Company</label>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                        <div class="form-group">
                            <input type="email" id="email" name="email" required placeholder="john@example.com">
                            <label for="email">Email</label>
                        </div>
                        <div class="form-group">
                            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                            <label for="phone">Phone</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <select id="service" name="service" required style="color: var(--text-secondary);">
                            <option value="" disabled selected>Select a Service</option>
                            <option value="digital-marketing">Digital Marketing</option>
                            <option value="web-dev">Web Design & Dev</option>
                            <option value="app-dev">Mobile App Dev</option>
                            <option value="ad-production">Advertisement Production</option>
                            <option value="sap">SAP Software</option>
                            <option value="custom-software">Custom Business Software</option>
                            <option value="ai">Digital Creation with AI</option>
                            <option value="branding">Branding & Print</option>
                            <option value="motion">Motion Graphics</option>
                        </select>
                        <label for="service">Service Needed</label>
                    </div>
                    
                    <div class="form-group">
                        <select id="budget" name="budget" style="color: var(--text-secondary);">
                            <option value="" disabled selected>Select Budget Range</option>
                            <option value="small">&lt; $10k</option>
                            <option value="medium">$10k - $50k</option>
                            <option value="large">$50k - $100k</option>
                            <option value="enterprise">&gt; $100k</option>
                        </select>
                        <label for="budget">Budget Range</label>
                    </div>
                    
                    <div class="form-group">
                        <textarea id="message" name="message" required placeholder="Tell us about your project..."></textarea>
                        <label for="message">Message</label>
                    </div>
                    
                    <div class="btn-magnet-wrap" style="align-self: flex-start; margin-top: 20px;">
                        <button type="submit" class="btn-futuristic btn-futuristic-cyan">
                            <span>Send Message</span>
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Right Side: Office Coordinates Card -->
            <div class="fade-up delay-2">
                <div class="glass-panel office-coordinate-card">
                    <h3 style="font-size: 2.2rem; text-transform: uppercase; margin-bottom: 10px;">Coordinates</h3>
                    <div style="width: 100%; height: 1px; background: var(--border-color); margin-bottom: 20px;"></div>
                    
                    <div class="office-info-item">
                        <h5>Agency Headquarters</h5>
                        <p>Trivandrum,<br>Kerala, India</p>
                    </div>
                    
                    <div class="office-info-item">
                        <h5>Direct Channels</h5>
                        <p style="margin-bottom: 8px;">
                            <a href="mailto:hello@aprilgrid.com" class="text-gradient-cyan">hello@aprilgrid.com</a>
                        </p>
                        <p class="mono-num" style="font-size: 1.25rem;">+91 9688 503503</p>
                    </div>
                    
                    <div class="office-info-item">
                        <h5>Telemetry</h5>
                        <div class="office-socials-grid">
                            <a href="https://www.instagram.com/aprilgrid" target="_blank" class="social-link">Instagram</a>
                            <a href="#" class="social-link">LinkedIn</a>
                            <a href="#" class="social-link">Behance</a>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </section>

    <div id="footer-container"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selectElements = document.querySelectorAll('select');
            selectElements.forEach(select => {
                select.addEventListener('change', function() {
                    this.style.color = '#ffffff';
                });
            });
        });
    </script>
</body>
</html>
